[package]
name = "erp-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Where a file actually lives: an engine, a key, and a checksum that is verified on read."

[lints]
workspace = true

[dependencies]
# Deliberately thin, like `erp-occupancy` and `erp-links`. No database at all:
# this stores bytes under a key. What a file *means* — who it belongs to, who
# may read it — is a module's, and the day this crate learns any of it is the
# day it stops being swappable.
erp-i18n = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }

# The S3 engine. See the workspace manifest for why `aws-base` and not `aws`.
object_store = { workspace = true }
# SHA-256 and HMAC-SHA256 for SigV4, from the library this build already links.
openssl = { workspace = true }
# `object_store`'s default HTTP connector is `reqwest`, and the feature that
# names it deliberately turns on no TLS of its own. Depending on it *here*, with
# this workspace's `default-tls`, is what guarantees the OpenSSL stack is
# present even when this crate is built alone — a `cargo check -p erp-storage`
# that unified to a TLS-less reqwest would produce an engine that cannot speak
# `https` and would not say so until a request failed.
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
