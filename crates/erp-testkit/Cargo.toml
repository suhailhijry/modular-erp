[package]
name = "erp-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Test harness. Real Postgres, one fresh database per test, no mocks."

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
# `TenantId::named_in_database`, so what counts as a tenant database is decided
# in one place and not guessed at a second time here.
erp-types = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
dotenvy = "0.15"
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
