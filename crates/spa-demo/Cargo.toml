[package]
name = "spa-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A tenant with every module enabled and filled with plausible data."

[lints]
workspace = true

[dependencies]
# The third composition root, after `bin/api` and `bin/worker` — and the only
# one that has to know *every* module, because "every module enabled" is what it
# is for.
ledger = { workspace = true }
sales = { workspace = true }
spa-api = { workspace = true }
spa-control = { workspace = true }
spa-eventlog = { workspace = true }
spa-projection = { workspace = true }
spa-types = { workspace = true }

axum = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
spa-testkit = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
