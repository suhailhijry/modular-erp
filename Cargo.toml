[workspace]
resolver = "3"
members = ["crates/*", "modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.dependencies]
# Internal
spa-i18n = { path = "crates/spa-i18n" }
spa-eventlog = { path = "crates/spa-eventlog" }
spa-projection = { path = "crates/spa-projection" }
spa-types = { path = "crates/spa-types" }
spa-testkit = { path = "crates/spa-testkit" }
spa-control = { path = "crates/spa-control" }
spa-worker = { path = "crates/spa-worker" }
spa-api = { path = "crates/spa-api" }
spa-web = { path = "crates/spa-web" }
spa-demo = { path = "crates/spa-demo" }
ledger = { path = "modules/ledger" }
sales = { path = "modules/sales" }
purchases = { path = "modules/purchases" }
tax_sa = { path = "modules/tax_sa" }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & identity
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["serde", "v5", "v7"] }

# Bytes on the wire. ZATCA wants an invoice hashed with SHA-256, that hash in
# base64, the previous one in base64 of its *hex* (see `tax_sa::zatca::chain`),
# and the QR as base64 of a TLV string. All three were already in the lock as
# transitive dependencies; naming them here adds nothing to the build.
sha2 = "0.11"
base64 = "0.22"
hex = "0.4"

# Key generation, the CSR, and sealing secrets at rest. **Already linked**: sqlx
# builds against it for Postgres TLS, so this is the library the process has
# rather than a second one. See `tax_sa::zatca::csr` for what ZATCA needs from
# it — secp256k1, a PKCS#10 request, and two extensions written as exact DER.
openssl = "0.10"

# SMTP. `native-tls` on purpose: it is OpenSSL, which sqlx already links for
# Postgres TLS — the same call made for `reqwest`, and the reason this build has
# one TLS stack rather than two. Default features are off because they pull
# rustls, a second resolver, and a file transport nothing uses.
#
# Not hand-rolled: an Arabic subject line needs RFC 2047 encoded-words and an
# Arabic body needs quoted-printable or base64 with the right charset, and
# getting either subtly wrong produces mail that renders as mojibake in exactly
# the clients this market uses.
# Shared state across API replicas: the session cache, and the invalidation
# broadcast that lets one node's write reach another node's cache before the TTL
# does. `connection-manager` for automatic reconnection — Redis being briefly
# unreachable must degrade to today's behaviour, not to an outage.
#
# `tokio-native-tls-comp` rather than the rustls variant, so `rediss://` uses the
# OpenSSL this build already links. Same call as reqwest and lettre.
redis = { version = "1.6", default-features = false, features = [
    "tokio-comp", "connection-manager", "tokio-native-tls-comp",
] }

lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport", "native-tls", "tokio1", "tokio1-native-tls", "builder",
] }

# Async
async-trait = "0.1"
# Stream adapters. Already in the lock through sqlx; named here for the Redis
# pub/sub stream in `spa_control::shared`.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP
axum = { version = "0.8", features = ["macros"] }

# The client, for the one external service this system talks to: ZATCA.
#
# `default-tls` rather than `rustls-tls` deliberately. sqlx already links
# native-tls against OpenSSL for Postgres, and every piece of cryptography here
# — key generation, the CSR, signing, sealing — is OpenSSL too. Choosing rustls
# would put a second TLS implementation in the same process for no benefit.
#
# No cookies, no gzip, no blocking client: six JSON endpoints on one host.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "default-tls",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }

# The OpenAPI document is derived from the handlers and the wire types rather
# than written alongside them, for the same reason `docs/ERRORS.md` is generated:
# a hand-written one is wrong within a month, in the direction that costs an
# integrator a day. `utoipa-axum` is what makes it structural — a route is
# registered from its `#[utoipa::path]` attribute, so a handler that is served
# and not documented does not compile.
# Deliberately without `axum_extras`: it infers path parameters from the
# handler's signature and hits an `unreachable!()` on `Path<HashMap<_, _>>`,
# which is how every nested route here reads its parameters by name. Parameters
# are declared in the attribute instead, which is where their descriptions
# belong regardless.
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"

# Storage
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-native-tls",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Testing
proptest = "1"

# `warn` rather than `deny` in the manifest: CI runs `clippy -- -D warnings`, so
# these still fail the build there, while local iteration stays workable.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Signal-to-noise: these fire constantly on correct code.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Law L6 — failures stop, they never degrade. Silent unwrapping in library code
# is exactly the "log a warning and continue" pattern the prototype died of.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

# Correctness lints worth escalating past `warn`.
float_arithmetic = "deny"        # money is integer minor units, always
mem_forget = "deny"

[profile.dev]
# Big win on link time for a workspace this shape.
debug = 1

[profile.test]
debug = 1
