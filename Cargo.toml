[workspace]
resolver = "3"
members = ["crates/*", "modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.dependencies]
# Internal
spa-i18n = { path = "crates/spa-i18n" }
spa-eventlog = { path = "crates/spa-eventlog" }
spa-projection = { path = "crates/spa-projection" }
spa-types = { path = "crates/spa-types" }
spa-testkit = { path = "crates/spa-testkit" }
spa-control = { path = "crates/spa-control" }
spa-worker = { path = "crates/spa-worker" }
spa-api = { path = "crates/spa-api" }
ledger = { path = "modules/ledger" }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & identity
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["serde", "v5", "v7"] }

# Async
async-trait = "0.1"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }

# Storage
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-native-tls",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Testing
proptest = "1"

# `warn` rather than `deny` in the manifest: CI runs `clippy -- -D warnings`, so
# these still fail the build there, while local iteration stays workable.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Signal-to-noise: these fire constantly on correct code.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Law L6 — failures stop, they never degrade. Silent unwrapping in library code
# is exactly the "log a warning and continue" pattern the prototype died of.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

# Correctness lints worth escalating past `warn`.
float_arithmetic = "deny"        # money is integer minor units, always
mem_forget = "deny"

[profile.dev]
# Big win on link time for a workspace this shape.
debug = 1

[profile.test]
debug = 1
