[[bin]]
name = "api"
path = "src/api/main.rs"

[[bin]]
name = "workers"
path = "src/workers/main.rs"

[package]
name = "spa"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["multipart", "http2"] }
chrono = { version = "0.4.45", features = ["serde"] }
oxana = "2.0.1"
reqwest = { version = "0.13.4", features = ["native-tls", "json"] }
serde = { version = "1.0.229", features = ["derive", "std", "alloc"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio", "sqlx-postgres", "tls-native-tls", "bigdecimal"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tracing-subscriber = { version = "0.3.23", features = ["serde", "serde_json", "chrono", "tracing"] }
uuid = { version = "1.24.0", features = ["serde", "v4", "v5", "v7"] }
spa-macros = { path = "spa-macros" }
tracing = "0.1.44"
rdkafka = { version = "0.39.0", features = ["cmake-build", "tracing"] }
rand = { version = "0.10.2", features = ["std"] }
argon2 = { version = "0.5.3", features = ["std"] }
sha2 = "0.11.0"
subtle = "2.6.1"
hex = "0.4.3"
rand_core = "0.10.1"
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
redis = { version = "1.5.0", features = ["connection-manager"] }
tower-http = { version = "0.7.0", features = ["full"] }
