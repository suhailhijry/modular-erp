# In front of the API replicas.
#
# Without this, two replicas is a fiction: compose can only publish one host
# port, so every request would land on whichever container won the race to bind
# it and the second would sit idle. The whole reason the stack runs two is that
# they have to *agree* — about a logged-out session, about a changed role — and
# nothing exercises that unless requests actually spread across both.
#
# Docker's embedded DNS resolves `api` to every healthy replica and rotates the
# answers, so `proxy_pass` to a name is round-robin without an upstream block.

events {}

http {
    # **The tenant is the subdomain, so the Host header is not decoration.**
    # nginx rewrites `Host` to the upstream name by default, which would turn
    # every tenant-scoped request into a 404 — loudly, but confusingly.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Longer than the API's own 30-second request timeout, so a slow request is
    # refused by the thing that knows why (504 with a `code`) rather than by the
    # proxy with an HTML page.
    proxy_read_timeout 60s;

    # Re-resolve, because a replica that restarts gets a new address and nginx
    # otherwise caches the first answer until it is reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        location / {
            set $upstream http://api:8080;
            proxy_pass $upstream;
        }
    }
}
