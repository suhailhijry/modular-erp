# Everything `just check` runs, on hardware nobody has configured by hand.
#
# The point of this file is not that it runs the tests — a developer already
# does. It is that it runs them against a database and a cache that were created
# thirty seconds ago, which is the only way to find the setup steps that live in
# somebody's shell history instead of in the repository.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first. Nobody reads the results of a commit that
# has already been replaced.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on a warning here as well as in `just lint`, so a warning in a build
  # script or a dependency's cfg is not invisible until someone looks.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # Pinned to the version `compose.yaml` runs. A test suite that passes on
      # 18.3 and is never run on it again is not a gate.
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      # Not optional. `crates/erp-control/tests/shared.rs` **refuses** rather
      # than skipping when Redis is absent — that is law L6, and it means a
      # runner without this service fails four tests rather than quietly
      # covering three fewer things than the badge claims.
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/postgres
      REDIS_URL: redis://127.0.0.1/
      # The committed `.sqlx` is what the build must compile against. Pointing
      # the macros at the live database instead would let a stale checkout pass
      # here and fail on a machine without one.
      SQLX_OFFLINE: "true"
      # **The S3 engine is only tested if something is listening.**
      # `crates/erp-storage/tests/s3.rs` skips when `S3_BUCKET` is unset, and a
      # test that skips for ever is not coverage — everything that can go wrong
      # in that engine is on the wire, where a mock cannot reach it. `MinIO` is
      # started below.
      S3_BUCKET: documents
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_ALLOW_HTTP: "true"

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel and components, so there is
      # nothing to state twice.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      # `just test` runs the suite under nextest. A prebuilt binary, because
      # `cargo install cargo-nextest` from source costs more than the suite it
      # is there to speed up.
      - uses: taiki-e/install-action@nextest

      # **The client has to match the server**, and it does not by default.
      # `ubuntu-latest` ships `postgresql-client` 16; the service above is 18.3;
      # and `pg_dump` refuses outright to read a server newer than itself. That
      # is one test — `erp-control::restore` — failing here and passing on every
      # developer's machine, which is the worst shape a CI failure comes in.
      #
      # PGDG is where a matching client comes from. The version is pinned to the
      # same number as the image, for the same reason the image is pinned: a
      # pair that drifts apart silently is not a gate.
      - name: Install a psql that matches the server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          # Ahead of the 16 client the image already has. `pg_wrapper` chooses a
          # version from a cluster, there is no cluster on a runner, and what it
          # picks when there is none is not something to depend on.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: The client and the server agree
        run: |
          pg_dump --version
          psql --version

      # **Not a `services:` entry.** MinIO needs `server /data` as arguments and
      # a service container cannot pass any, so it runs as a step. Same image
      # and same credentials as `compose.yaml`, for the reason the Postgres
      # image is pinned: a pair that drifts apart silently is not a gate.
      - name: A bucket for the S3 engine to be tested against
        run: |
          docker run --detach --name minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for _ in $(seq 60); do
            curl --silent --fail http://localhost:9000/minio/health/live && break
            sleep 2
          done
          docker run --rm --network host minio/mc:latest sh -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin \
             && mc mb --ignore-existing local/documents"

      # fmt, then clippy, then the suite — the order that fails fastest.
      # Ignored tests stay ignored: the soak test, the rebuild benchmark, and
      # the ZATCA sandbox tests, which need a real taxpayer certificate.
      - name: just check
        run: just check

  # Separate, because it needs `sqlx-cli` and answers a different question:
  # not "does this build" but "is the committed offline data what these
  # migrations would produce". A stale `.sqlx` builds fine right up until
  # someone regenerates it.
  offline-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: offline-data

      - uses: extractions/setup-just@v2

      # **The client has to match the server**, and it does not by default.
      # `ubuntu-latest` ships `postgresql-client` 16; the service above is 18.3;
      # and `pg_dump` refuses outright to read a server newer than itself. That
      # is one test — `erp-control::restore` — failing here and passing on every
      # developer's machine, which is the worst shape a CI failure comes in.
      #
      # PGDG is where a matching client comes from. The version is pinned to the
      # same number as the image, for the same reason the image is pinned: a
      # pair that drifts apart silently is not a gate.
      - name: Install a psql that matches the server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          # Ahead of the 16 client the image already has. `pg_wrapper` chooses a
          # version from a cluster, there is no cluster on a runner, and what it
          # picks when there is none is not something to depend on.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: The client and the server agree
        run: |
          pg_dump --version
          psql --version

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      - name: just prepare
        run: just prepare

      - name: The committed offline data is what these migrations produce
        run: |
          if ! git diff --exit-code --stat .sqlx; then
            echo "::error::.sqlx is out of date. Run 'just prepare' and commit the diff."
            exit 1
          fi
