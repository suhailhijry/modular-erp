[package]
name = "sales"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sales invoicing with Saudi VAT, posting to the ledger."

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
# The second module, and the first to depend on another one. See `lib.rs` on why
# that is deliberate rather than a shortcut.
crm = { workspace = true }
ledger = { workspace = true }

# **Claims, for the one check that guards issuing a credit note.**
#
# A sibling edge and not a cycle — `hr` depends on neither `sales` nor
# `purchases` — matching what `purchases` does for approving a payment. The
# check is in the command rather than the route because a credit note raised by
# anything other than a request is still a credit note.
hr = { workspace = true }

# The module ships its own routes; `erp-web` is what they are built from.
erp-web = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
erp-tenant = { workspace = true }
erp-eventlog = { workspace = true }
erp-i18n = { workspace = true }
erp-projection = { workspace = true }
erp-types = { workspace = true, features = ["sqlx"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
erp-control = { workspace = true }
erp-testkit = { workspace = true }
chrono = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["full"] }
