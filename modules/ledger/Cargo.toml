[package]
name = "ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Double-entry accounting: accounts, journal entries, and the invariant that keeps them honest."

[lints]
workspace = true

[dependencies]
# The fiscal calendar counts months and weeks; the tenant's own `Calendar`
# turns its days into instants.
chrono = { workspace = true }
# `erp-tenant` is the handle a command needs — `TenantDb`, `CommandError`,
# `ModuleSetup` — and nothing else. It deliberately does **not** carry
# `ClusterRegistry`, `FleetPlan`, `PlacementPolicy` or `TenantPools`: a module
# is part of a binary that may ship to a customer's own cloud (D15), and that
# binary cannot hold the map of every other tenant.
#
# `erp-control` is a dev-dependency only, for `MIGRATIONS` in tests.
# The module ships its own routes; `erp-web` is what they are built from.
# **`branches`, and only for one check.** Every posting in the system arrives at
# `post_entry_in`, which is where a closed period is refused — so it is also the
# one place a branch that names nothing open can be refused, once, for all four
# modules that post. `branches` depends on nothing, which is what makes it safe
# to sit under this one.
branches = { workspace = true }
erp-web = { workspace = true }
# The amount a permission limit may be about. See `post_entry`.
erp-rules = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
erp-tenant = { workspace = true }
erp-eventlog = { workspace = true }
erp-i18n = { workspace = true }
erp-projection = { workspace = true }
erp-types = { workspace = true, features = ["sqlx"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
erp-control = { workspace = true }
erp-testkit = { workspace = true }
erp-i18n = { workspace = true }
proptest = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
