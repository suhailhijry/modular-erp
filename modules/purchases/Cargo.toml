[package]
name = "purchases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Supplier bills and the input-tax side of a Saudi VAT return."

[lints]
workspace = true

[dependencies]
# The accounting kernel. `purchases` and `sales` are siblings and never see each
# other; what they share — `VatCategory`, posting, the closed-period check —
# lives here, in the module they both stand on.
ledger = { workspace = true }

# **Claims, for the one check that guards approving a payment.**
#
# A sibling edge, not a cycle — `hr` depends on neither `purchases` nor
# `sales` — and seven modules already stand on `hr`. The check is here rather
# than at the route because §9c says so and because it must hold for a caller
# that is not a request: a job paying a bill is still approving a payment.
hr = { workspace = true }

# **Where a bill line that bought stock posts.** A delivery debits inventory and
# credits goods-received-not-invoiced; the bill line that names the product
# debits that back, so the decision has to be taken where the entry is built.
# `inventory` depends on `ledger` and `branches` and on nothing that depends on
# it, so the arrow points one way and cargo has no cycle to refuse. It costs one
# thing, and it is the system's own rule: `/v1/purchases` is refused while
# `proj_inventory` is older than the build, because `reads` is what a route is
# served from.
inventory = { workspace = true }

# The module ships its own routes; `erp-web` is what they are built from.
erp-web = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
erp-tenant = { workspace = true }
erp-eventlog = { workspace = true }
erp-i18n = { workspace = true }
erp-projection = { workspace = true }
erp-types = { workspace = true, features = ["sqlx"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
erp-control = { workspace = true }
erp-testkit = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
