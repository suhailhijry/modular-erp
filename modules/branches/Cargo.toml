[package]
name = "branches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Places a business trades from, and the dimension every document is reported by."

[lints]
workspace = true

[dependencies]
# `erp-tenant` is the handle a command needs — `TenantDb`, `CommandError`,
# `ModuleSetup` — and nothing else. It deliberately does **not** carry
# `ClusterRegistry`, `FleetPlan`, `PlacementPolicy` or `TenantPools`: a module
# is part of a binary that may ship to a customer's own cloud (D15), and that
# binary cannot hold the map of every other tenant.
#
# `erp-control` is a dev-dependency only, for `MIGRATIONS` in tests.
# The module ships its own routes; `erp-web` is what they are built from.
erp-web = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
erp-tenant = { workspace = true }
erp-eventlog = { workspace = true }
erp-i18n = { workspace = true }
erp-projection = { workspace = true }
erp-types = { workspace = true, features = ["sqlx"] }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# **The exit criterion is what a branch is for**, so the test that carries this
# module drives real documents through `pos` and `sales` and reads the ledger
# per branch. Dev-only: nothing here depends on them, which is the point.
booking = { workspace = true }
pos = { workspace = true }
sales = { workspace = true }
ledger = { workspace = true }
crm = { workspace = true }
erp-control = { workspace = true }
erp-testkit = { workspace = true }
erp-i18n = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
