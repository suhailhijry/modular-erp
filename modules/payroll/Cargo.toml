[package]
name = "payroll"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "What a business pays its people, and the entry it makes."

[lints]
workspace = true

[dependencies]
erp-web = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
erp-tenant = { workspace = true }
erp-eventlog = { workspace = true }
erp-i18n = { workspace = true }
erp-projection = { workspace = true }
erp-types = { workspace = true, features = ["sqlx"] }
# What a person is paid, read from `hr`'s **log** inside the transaction that
# posts. `ledger` because a run is a journal entry and this module writes it
# through the same seam `sales` uses for an invoice.
hr = { workspace = true }
ledger = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hr = { workspace = true }
ledger = { workspace = true }
branches = { workspace = true }
erp-control = { workspace = true }
erp-testkit = { workspace = true }
erp-i18n = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
