[package]
name = "tax_sa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Saudi Arabia: VAT rates, the return, and what has been filed."

[lints]
workspace = true

[dependencies]
# **The first module that stands on two.** A return nets what was charged
# against what was paid, and those live in two modules — so the thing that nets
# them is a module above both rather than a third sibling reaching sideways.
ledger = { workspace = true }
sales = { workspace = true }
purchases = { workspace = true }

# The module ships its own routes; `erp-web` is what they are built from.
erp-web = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
erp-control = { workspace = true }
erp-eventlog = { workspace = true }
erp-i18n = { workspace = true }
erp-projection = { workspace = true }
erp-types = { workspace = true, features = ["sqlx"] }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
openssl = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
erp-testkit = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
openssl = { workspace = true }
tokio = { workspace = true, features = ["full"] }
